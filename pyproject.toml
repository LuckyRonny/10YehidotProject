[project]
name = "10yehidotproject"
version = "0.1.0"
description = "Ronny's project"
authors = [
    {name = "getzronny@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome (>=3.23.0,<4.0.0)",
    "cryptography (>=46.0.4,<47.0.0)",
    "pyqt6 (>=6.10.2,<7.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.1,<3.0.0)",
    "playwright (>=1.58.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
